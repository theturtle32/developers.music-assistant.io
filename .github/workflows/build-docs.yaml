name: build-docs
on:
  workflow_dispatch:
  push:
    branches:
      # preview deployment: this branch, not the upstream default branches
      - preview
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the server repo for its documentation
        uses: actions/checkout@v4
        with:
          # pinned to the fork's branch under review rather than upstream dev, which does
          # not carry the architecture and package docs yet
          repository: theturtle32/music-assistant-server
          ref: docs/architecture-refresh-v2
          path: .server
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v3
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install -r requirements.txt
      - name: Pull the documentation out of the server repo
        run: python scripts/pull_server_docs.py .server --output docs
      - run: mkdocs gh-deploy --force
